<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>UPOSA - University Practice Old Students' Association | The Legit Elites</title>
    <meta name="description" content="UPOSA is the official alumni association of University Practice Senior High School (UPSHS), Cape Coast, Ghana. Join fellow alumni, support your alma mater, and stay connected." />
    <meta name="keywords" content="UPOSA, University Practice, Old Students Association, UPSHS, Cape Coast, Ghana, Alumni, Legit Elites, Senior High School" />
    <meta name="author" content="UPOSA National" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://uposa.org" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uposa.org" />
    <meta property="og:title" content="UPOSA - University Practice Old Students' Association" />
    <meta property="og:description" content="Join the official alumni network of University Practice Senior High School. Connect, contribute, and celebrate our legacy." />
    <meta property="og:image" content="https://uposa.org/og-image.png" />
    <meta property="og:site_name" content="UPOSA" />
    <meta property="og:locale" content="en_GH" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UPOSA - University Practice Old Students' Association" />
    <meta name="twitter:description" content="Join the official alumni network of University Practice Senior High School. Connect, contribute, and celebrate our legacy." />
    <meta name="twitter:image" content="https://uposa.org/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "UPOSA - University Practice Old Students' Association",
      "alternateName": "UPOSA",
      "url": "https://uposa.org",
      "logo": "https://uposa.org/logo.png",
      "description": "The official alumni association of University Practice Senior High School (UPSHS), Cape Coast, Ghana.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "University Practice Senior High School, UCC",
        "addressLocality": "Cape Coast",
        "addressCountry": "GH"
      },
      "sameAs": [
        "https://www.facebook.com/share/1Ckq3GEdMS/",
        "https://www.instagram.com/uposanational"
      ]
    }
    </script>

    <!-- Fonts -->

    <!-- Boot splash (shown instantly before React/CSS load; replaced on mount) -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0a1633;text-align:center}
      #boot-splash img{width:96px;height:96px;object-fit:contain;animation:bs-pulse 1.8s ease-in-out infinite;filter:drop-shadow(0 12px 34px rgba(0,0,0,.5))}
      #boot-splash .bs-word{font-family:Georgia,'Times New Roman',serif;color:#faf7ef;font-size:40px;font-weight:bold;letter-spacing:2px;line-height:1}
      #boot-splash .bs-tag{margin-top:8px;color:#e3b341;font-size:11px;font-weight:bold;letter-spacing:.32em;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif}
      #boot-splash .bs-dots{display:flex;gap:8px;margin-top:6px}
      #boot-splash .bs-dots span{width:10px;height:10px;border-radius:50%;background:#e3b341;animation:bs-bounce 1s infinite ease-in-out}
      #boot-splash .bs-dots span:nth-child(1){animation-delay:-.3s}
      #boot-splash .bs-dots span:nth-child(2){animation-delay:-.15s}
      @keyframes bs-bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-9px);opacity:1}}
      @keyframes bs-pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <img src="/logo.png" alt="UPOSA" />
        <div>
          <div class="bs-word">UPOSA</div>
          <div class="bs-tag">The Legit Elites</div>
        </div>
        <div class="bs-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
