<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a1633" />
    <meta name="author" content="UPOSA National" />

    <!--
      Generic head tags for the SPA shell. Every prerendered page replaces the
      data-seo-default tags with its own (scripts/prerender.mjs), and main.tsx
      removes them before a client-rendered page adds its own, so a page never
      ships two titles/descriptions/canonicals.
    -->
    <title data-seo-default>UPOSA | University Practice SHS Old Students' Association, Cape Coast</title>
    <meta data-seo-default name="description" content="UPOSA is the official old students' association of University Practice Senior High School (UPSHS), Cape Coast, Ghana. Register as an alumnus, pay dues, back school projects, and reconnect with your year group." />
    <meta data-seo-default property="og:type" content="website" />
    <meta data-seo-default property="og:site_name" content="UPOSA" />
    <meta data-seo-default property="og:title" content="UPOSA | University Practice SHS Old Students' Association" />
    <meta data-seo-default property="og:description" content="The official alumni network of University Practice Senior High School, Cape Coast. Connect, contribute, and celebrate our legacy." />
    <meta data-seo-default property="og:image" content="https://www.uposa.org/og-image.png" />
    <meta data-seo-default name="twitter:card" content="summary_large_image" />

    <!-- Apply the saved/OS theme before first paint so dark-mode visitors don't see a light flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('uposa-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'uposa-dark' : 'uposa-light');
        } catch (e) { /* storage blocked: React applies the theme after mount */ }
      })();
    </script>

    <!-- Boot splash (shown instantly before React/CSS load on client-rendered pages; replaced on mount) -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0a1633;text-align:center}
      #boot-splash img{width:96px;height:96px;object-fit:contain;animation:bs-pulse 1.8s ease-in-out infinite;filter:drop-shadow(0 12px 34px rgba(0,0,0,.5))}
      #boot-splash .bs-word{font-family:Georgia,'Times New Roman',serif;color:#faf7ef;font-size:40px;font-weight:bold;letter-spacing:2px;line-height:1}
      #boot-splash .bs-tag{margin-top:8px;color:#e3b341;font-size:11px;font-weight:bold;letter-spacing:.32em;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif}
      #boot-splash .bs-dots{display:flex;gap:8px;margin-top:6px}
      #boot-splash .bs-dots span{width:10px;height:10px;border-radius:50%;background:#e3b341;animation:bs-bounce 1s infinite ease-in-out}
      #boot-splash .bs-dots span:nth-child(1){animation-delay:-.3s}
      #boot-splash .bs-dots span:nth-child(2){animation-delay:-.15s}
      @keyframes bs-bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-9px);opacity:1}}
      @keyframes bs-pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <img src="/logo.webp" alt="UPOSA" width="96" height="96" />
        <div>
          <div class="bs-word">UPOSA</div>
          <div class="bs-tag">The Legit Elites</div>
        </div>
        <div class="bs-dots"><span></span><span></span><span></span></div>
      </div>
      <!--app-html:end-->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
