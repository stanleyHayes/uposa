# Render Blueprint for UPOSA Platform
# Deploy this blueprint at: https://dashboard.render.com/blueprints

services:
  # ── API Service ─────────────────────────────────────────
  - type: web
    name: uposa-api
    runtime: docker
    region: oregon
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://alumni.uposa.org
      - key: ADMIN_URL
        value: https://admin.uposa.org
      - key: ALLOWED_ORIGINS
        value: https://uposa.org,https://www.uposa.org,https://admin.uposa.org,https://alumni.uposa.org,https://uposa-admin.vercel.app,https://uposa-alumni.vercel.app
      - key: PAYMENT_CALLBACK_BASE_URL
        value: https://alumni.uposa.org
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: "UPOSA <noreply@uposa.org>"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
    healthCheckPath: /health
